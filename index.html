<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datacore - Vintage Digital</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabin:wght@500&family=Instrument+Serif:ital,wght@0,400;1,400&family=Inter:wght@400&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#7b39fc',
                        secondary: '#2b2344',
                    },
                    fontFamily: {
                        manrope: ['Manrope', 'sans-serif'],
                        cabin: ['Cabin', 'sans-serif'],
                        instrument: ['Instrument Serif', 'serif'],
                        inter: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        html { scroll-behavior: smooth; }
        body { margin: 0; padding: 0; background-color: #05020a; color: white; overflow-x: hidden; }
        
        /* --- NOISE/GRAIN OVERLAY --- */
        .noise-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://grainy-gradients.vercel.app/noise.svg');
            opacity: 0.15;
            pointer-events: none;
            z-index: 90;
            filter: contrast(150%) brightness(100%);
        }

        /* --- SHINY GLOW EFFECTS --- */
        .glow-text {
            text-shadow: 0 0 20px rgba(123, 57, 252, 0.5), 0 0 40px rgba(123, 57, 252, 0.2);
        }

        .shiny-card {
            background: rgba(25, 15, 40, 0.7);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(164, 132, 215, 0.3);
            box-shadow: 0 0 30px rgba(123, 57, 252, 0.1);
        }

        /* --- ULTRA GLOW CONTACT BORDER --- */
        .glowing-container {
            position: relative;
            padding: 3px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 0 60px -10px rgba(123, 57, 252, 0.8);
        }

        .glowing-container::before {
            content: '';
            position: absolute;
            width: 200%; height: 200%;
            background: conic-gradient(transparent, #7b39fc, #fff, #7b39fc, transparent 40%);
            top: -50%; left: -50%;
            animation: borderRotate 2.5s linear infinite;
        }

        @keyframes borderRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .glowing-inner {
            position: relative;
            z-index: 10;
            background: #080510;
            border-radius: 21px;
        }

        .footer-glow {
            box-shadow: 0 -30px 100px -20px rgba(123, 57, 252, 0.5);
        }

        /* Responsive height fix for contact section */
        #contactus { min-height: 100vh; display: flex; align-items: center; }
    </style>
</head>
<body>
    <div id="root"></div>
    <div class="noise-overlay"></div>

    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const LandingPage = () => {
            const [blurAmount, setBlurAmount] = useState(0);

            useEffect(() => {
                const handleScroll = () => {
                    setBlurAmount(Math.min(window.scrollY / 20, 25));
                };
                window.addEventListener("scroll", handleScroll);
                return () => window.removeEventListener("scroll", handleScroll);
            }, []);

            const scrollToSection = (id) => {
                const element = document.getElementById(id);
                if (element) element.scrollIntoView({ behavior: 'smooth' });
            };

            return (
                <div className="relative w-full">
                    {/* VIDEO BACKGROUND */}
                    <div className="fixed inset-0 z-0 pointer-events-none" style={{ filter: `blur(${blurAmount}px) sepia(20%)` }}>
                        <video autoPlay loop muted playsInline className="w-full h-full object-cover brightness-[0.5]">
                            <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260210_031346_d87182fb-b0af-4273-84d1-c6fd17d6bf0f.mp4" type="video/mp4" />
                        </video>
                    </div>

                    {/* NAVBAR */}
                    <nav className="fixed top-0 z-[100] w-full flex items-center justify-between px-6 lg:px-[120px] py-[20px] bg-black/40 backdrop-blur-xl border-b border-white/10">
                        <div className="flex items-center cursor-pointer" onClick={() => scrollToSection('home')}>
                            <svg width="28" height="28" viewBox="0 0 32 32" fill="none" className="drop-shadow-[0_0_10px_#fff]"><path d="M1.04356 6.35771L13.6437 0.666504V12.0489L1.04356 6.35771Z" fill="white"/><path d="M18.3563 0.666504L30.9564 6.35771L18.3563 12.0489V0.666504Z" fill="white"/><path d="M1.04356 25.6423L13.6437 31.3335V19.9511L1.04356 25.6423Z" fill="white"/><path d="M18.3563 31.3335L30.9564 25.6423L18.3563 19.9511V31.3335Z" fill="white"/></svg>
                        </div>
                        <div className="hidden lg:flex items-center gap-10 font-manrope font-bold text-[13px] tracking-widest uppercase">
                            {["Home", "Services", "Reviews", "Contact Us"].map((link) => (
                                <button key={link} onClick={() => scrollToSection(link.toLowerCase().replace(' ', ''))} className="hover:text-primary hover:drop-shadow-[0_0_8px_#7b39fc] transition-all">{link}</button>
                            ))}
                        </div>
                        <div className="flex items-center gap-4">
                            <button onClick={() => scrollToSection('contactus')} className="bg-primary hover:scale-105 px-7 py-2.5 rounded-[6px] font-manrope font-bold text-xs tracking-widest uppercase shadow-[0_0_20px_rgba(123,57,252,0.6)] transition-all">Get Started</button>
                        </div>
                    </nav>

                    {/* CONTENT */}
                    <main className="relative z-10">
                        
                        {/* HERO */}
                        <section id="home" className="min-h-screen flex flex-col items-center justify-center text-center px-6">
                            <div className="bg-white/10 backdrop-blur-md px-4 py-1.5 rounded-full mb-8 border border-white/20 shadow-[0_0_15px_rgba(255,255,255,0.1)]">
                                <span className="font-manrope text-[10px] font-bold tracking-[0.3em] text-white">DATACORE // V3.2</span>
                            </div>
                            <h1 className="font-instrument text-[55px] md:text-[105px] leading-[1.05] max-w-[1100px] mb-8 glow-text">
                                Book your perfect stay instantly <br/> <span className="italic">and</span> hassle-free
                            </h1>
                            <p className="text-white/70 font-inter text-lg md:text-xl max-w-[600px] mb-12">Handpicked luxury for the modern digital nomad. Faster, smarter, and more secure booking.</p>
                            <button onClick={() => scrollToSection('contactus')} className="bg-white text-black px-12 py-5 rounded-full font-manrope font-bold text-sm tracking-widest uppercase hover:bg-primary hover:text-white hover:shadow-[0_0_30px_#7b39fc] transition-all">Start Booking</button>
                        </section>

                        {/* SERVICES */}
                        <section id="services" className="py-32 px-6 lg:px-[120px]">
                            <h2 className="font-instrument text-6xl md:text-8xl mb-24 text-center glow-text">Our Services</h2>
                            <div className="grid lg:grid-cols-3 gap-8 max-w-7xl mx-auto">
                                {[
                                    { t: "Concierge 24/7", d: "Global support for every whim, handled by professionals.", img: "https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=800&q=80" },
                                    { t: "Exclusive Access", d: "Off-market properties you won't find anywhere else.", img: "https://images.unsplash.com/photo-1540541338287-41700207dee6?auto=format&fit=crop&w=800&q=80" },
                                    { t: "Fast Booking", d: "Proprietary stack ensuring 1-click checkout for elites.", img: "https://images.unsplash.com/photo-1436491865332-7a61a109c0f3?auto=format&fit=crop&w=800&q=80" }
                                ].map((s, i) => (
                                    <div key={i} className="shiny-card rounded-2xl overflow-hidden group hover:border-primary transition-all duration-500">
                                        <div className="h-56 overflow-hidden grayscale group-hover:grayscale-0 transition-all duration-700">
                                            <img src={s.img} className="w-full h-full object-cover opacity-60 group-hover:opacity-100" />
                                        </div>
                                        <div className="p-8">
                                            <h3 className="font-instrument text-3xl mb-4 italic text-white group-hover:text-primary transition-colors">{s.t}</h3>
                                            <p className="text-white/60 font-inter leading-relaxed">{s.d}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </section>

                        {/* REVIEWS (NO BG) */}
                        <section id="reviews" className="py-32 px-6 lg:px-[120px]">
                            <h2 className="font-instrument text-6xl md:text-8xl mb-24 text-center italic glow-text">Reviews</h2>
                            <div className="grid md:grid-cols-2 gap-12 max-w-5xl mx-auto">
                                <div className="border-l-2 border-primary pl-10 py-4">
                                    <p className="text-2xl font-instrument italic mb-6 leading-relaxed">"The interface feels like the future. Booking a villa in the Swiss Alps was as simple as sending a text."</p>
                                    <span className="font-manrope font-bold tracking-widest text-xs text-primary uppercase">Julian Thorne</span>
                                </div>
                                <div className="border-l-2 border-white/20 pl-10 py-4">
                                    <p className="text-2xl font-instrument italic mb-6 leading-relaxed">"Absolute transparency and elite selection. Datacore is the only platform I trust for my quarterly retreats."</p>
                                    <span className="font-manrope font-bold tracking-widest text-xs text-white/40 uppercase">Elena Rossi</span>
                                </div>
                            </div>
                        </section>

                        {/* CONTACT US (Sized to fit screen) */}
                        <section id="contactus" className="px-6 lg:px-[120px] pb-32">
                            <div className="max-w-4xl w-full mx-auto glowing-container">
                                <div className="glowing-inner p-8 md:p-12">
                                    <div className="text-center mb-10">
                                        <h2 className="font-instrument text-5xl md:text-6xl mb-4 glow-text italic">Inquire</h2>
                                        <p className="text-white/50 font-inter">Premium support for premium members.</p>
                                    </div>
                                    
                                    <form className="grid grid-cols-1 md:grid-cols-2 gap-6" onSubmit={e => e.preventDefault()}>
                                        <input type="text" placeholder="Name" className="bg-white/5 border border-white/10 p-4 rounded-lg focus:border-primary outline-none transition-all font-inter" />
                                        <input type="email" placeholder="Email" className="bg-white/5 border border-white/10 p-4 rounded-lg focus:border-primary outline-none transition-all font-inter" />
                                        <textarea placeholder="Your Message" className="md:col-span-2 bg-white/5 border border-white/10 p-4 rounded-lg h-32 focus:border-primary outline-none transition-all font-inter"></textarea>
                                        <button className="md:col-span-2 bg-primary py-4 rounded-lg font-manrope font-bold text-sm tracking-[0.2em] uppercase hover:shadow-[0_0_40px_rgba(123,57,252,0.8)] transition-all">Submit Request</button>
                                    </form>
                                </div>
                            </div>
                        </section>
                    </main>

                    {/* FOOTER */}
                    <footer className="relative z-10 footer-glow bg-black border-t border-white/10 py-20 px-6 lg:px-[120px]">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
                            <div className="flex items-center gap-4">
                                <div className="w-8 h-8 bg-white text-black flex items-center justify-center font-bold">D</div>
                                <span className="font-manrope font-bold tracking-[.4em] text-sm">DATACORE</span>
                            </div>
                            <div className="flex gap-10 text-white/30 text-[10px] font-manrope font-bold tracking-widest uppercase">
                                <a href="#" className="hover:text-primary transition-colors">Privacy</a>
                                <a href="#" className="hover:text-primary transition-colors">Terms</a>
                                <a href="#" className="hover:text-primary transition-colors">Legal</a>
                            </div>
                            <div className="text-white/20 text-[9px] font-inter uppercase tracking-[.3em]">
                                © 2026 Datacore. Designed for the Elite.
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<LandingPage />);
    </script>
</body>
</html>
