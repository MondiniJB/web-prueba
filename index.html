<!-- VERSION 2.0 - SHINY NOISE EDITION - MAY 2026 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datacore - Glowing Vintage</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabin:wght@500&family=Instrument+Serif:ital,wght@0,400;1,400&family=Inter:wght@400&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#7b39fc',
                        secondary: '#2b2344',
                    },
                    fontFamily: {
                        manrope: ['Manrope', 'sans-serif'],
                        cabin: ['Cabin', 'sans-serif'],
                        instrument: ['Instrument Serif', 'serif'],
                        inter: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        html { scroll-behavior: smooth; }
        body { margin: 0; padding: 0; background-color: #05020a; color: white; overflow-x: hidden; }
        
        /* --- DYNAMIC NOISE OVERLAY (OLD FILM LOOK) --- */
        .noise-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://grainy-gradients.vercel.app/noise.svg');
            opacity: 0.18;
            pointer-events: none;
            z-index: 90;
            filter: contrast(170%) brightness(100%);
        }

        /* --- SHINY GLOW --- */
        .glow-text {
            text-shadow: 0 0 15px rgba(123, 57, 252, 0.6), 0 0 30px rgba(123, 57, 252, 0.3);
        }

        .shiny-card {
            background: rgba(20, 10, 35, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(164, 132, 215, 0.4);
            box-shadow: 0 0 40px rgba(123, 57, 252, 0.15);
        }

        /* --- THE ANIMATED GLOWING BORDER --- */
        .glowing-container {
            position: relative;
            padding: 4px; /* Thickness */
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(123, 57, 252, 0.7);
        }

        .glowing-container::before {
            content: '';
            position: absolute;
            width: 250%; height: 250%;
            /* High contrast beam: White and Purple */
            background: conic-gradient(transparent, #7b39fc, #fff, #7b39fc, transparent 40%);
            top: -75%; left: -75%;
            animation: borderRotate 2s linear infinite;
        }

        @keyframes borderRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .glowing-inner {
            position: relative;
            z-index: 10;
            background: #080512;
            border-radius: 24px;
        }

        .footer-glow {
            box-shadow: 0 -30px 100px -20px rgba(123, 57, 252, 0.4);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <div class="noise-overlay"></div>

    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const LandingPage = () => {
            const [blur, setBlur] = useState(0);

            useEffect(() => {
                const handleScroll = () => setBlur(Math.min(window.scrollY / 15, 25));
                window.addEventListener("scroll", handleScroll);
                return () => window.removeEventListener("scroll", handleScroll);
            }, []);

            const scrollTo = (id) => {
                const el = document.getElementById(id);
                if (el) el.scrollIntoView({ behavior: 'smooth' });
            };

            return (
                <div className="relative w-full">
                    {/* VIDEO BACKGROUND */}
                    <div className="fixed inset-0 z-0" style={{ filter: `blur(${blur}px) contrast(1.1)` }}>
                        <video autoPlay loop muted playsInline className="w-full h-full object-cover brightness-[0.45]">
                            <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260210_031346_d87182fb-b0af-4273-84d1-c6fd17d6bf0f.mp4" type="video/mp4" />
                        </video>
                    </div>

                    {/* NAV */}
                    <nav className="fixed top-0 z-[100] w-full flex items-center justify-between px-6 lg:px-[120px] py-6 bg-black/50 backdrop-blur-md border-b border-white/5">
                        <div className="cursor-pointer" onClick={() => scrollTo('home')}>
                            <svg width="28" height="28" viewBox="0 0 32 32" fill="white" className="drop-shadow-[0_0_8px_#fff]"><path d="M1.04356 6.35771L13.6437 0.666504V12.0489L1.04356 6.35771Z"/><path d="M18.3563 0.666504L30.9564 6.35771L18.3563 12.0489V0.666504Z"/><path d="M1.04356 25.6423L13.6437 31.3335V19.9511L1.04356 25.6423Z"/><path d="M18.3563 31.3335L30.9564 25.6423L18.3563 19.9511V31.3335Z"/></svg>
                        </div>
                        <div className="hidden lg:flex gap-12 font-manrope font-bold text-[11px] tracking-[0.3em] uppercase">
                            {["Home", "Services", "Reviews", "Contact Us"].map(l => (
                                <button key={l} onClick={() => scrollTo(l.toLowerCase().replace(' ', ''))} className="hover:text-primary hover:drop-shadow-[0_0_5px_#7b39fc] transition-all">{l}</button>
                            ))}
                        </div>
                        <button onClick={() => scrollTo('contactus')} className="bg-primary px-8 py-2.5 rounded-sm font-manrope font-bold text-[10px] tracking-widest uppercase shadow-[0_0_20px_rgba(123,57,252,0.5)]">Get Started</button>
                    </nav>

                    {/* SECTIONS */}
                    <main className="relative z-10">
                        {/* HERO */}
                        <section id="home" className="min-h-screen flex flex-col items-center justify-center text-center px-6">
                            <div className="border border-white/20 bg-white/5 backdrop-blur-sm px-4 py-1 mb-8">
                                <span className="font-manrope text-[9px] font-bold tracking-[0.5em]">SYSTEM VERSION 3.2</span>
                            </div>
                            <h1 className="font-instrument text-[55px] md:text-[100px] leading-tight glow-text max-w-5xl mb-10">
                                Book your perfect stay instantly <br/> <span className="italic opacity-80">and</span> hassle-free
                            </h1>
                            <p className="text-white/60 font-inter text-lg max-w-xl mb-12">Digital luxury for the elite traveler. Fast, secure, and exclusive.</p>
                            <button onClick={() => scrollTo('contactus')} className="bg-white text-black px-12 py-5 font-manrope font-bold text-[11px] tracking-widest uppercase hover:bg-primary hover:text-white transition-all shadow-xl">Enter Datacore</button>
                        </section>

                        {/* SERVICES */}
                        <section id="services" className="py-40 px-6 lg:px-[120px]">
                            <h2 className="font-instrument text-6xl md:text-8xl text-center glow-text mb-24">Services</h2>
                            <div className="grid lg:grid-cols-3 gap-10 max-w-7xl mx-auto">
                                {[
                                    { t: "Concierge", d: "Global 24/7 support for elite requests.", img: "https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=800&q=80" },
                                    { t: "Exclusive", d: "Off-market properties worldwide.", img: "https://images.unsplash.com/photo-1540541338287-41700207dee6?auto=format&fit=crop&w=800&q=80" },
                                    { t: "Instant", d: "One-click booking for our members.", img: "https://images.unsplash.com/photo-1436491865332-7a61a109c0f3?auto=format&fit=crop&w=800&q=80" }
                                ].map((s, i) => (
                                    <div key={i} className="shiny-card group transition-all duration-500 overflow-hidden rounded-xl">
                                        <div className="h-60 grayscale group-hover:grayscale-0 transition-all duration-700">
                                            <img src={s.img} className="w-full h-full object-cover opacity-50 group-hover:opacity-100" />
                                        </div>
                                        <div className="p-10">
                                            <h3 className="font-instrument text-3xl italic mb-4">{s.t}</h3>
                                            <p className="text-white/50 font-inter text-sm leading-relaxed">{s.d}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </section>

                        {/* REVIEWS (TRANSPARENT) */}
                        <section id="reviews" className="py-40 px-6 lg:px-[120px]">
                            <h2 className="font-instrument text-6xl md:text-8xl text-center glow-text italic mb-24">Testimonials</h2>
                            <div className="grid md:grid-cols-2 gap-20 max-w-4xl mx-auto">
                                <div className="border-l border-primary pl-10">
                                    <p className="text-2xl font-instrument italic mb-6">"The Swiss Alps villa was stunning. Datacore makes high-end travel feel effortless."</p>
                                    <span className="font-manrope font-bold text-[10px] tracking-widest text-primary uppercase">Marcus V.</span>
                                </div>
                                <div className="border-l border-white/20 pl-10">
                                    <p className="text-2xl font-instrument italic mb-6">"A level of service that doesn't exist elsewhere. Simply the best."</p>
                                    <span className="font-manrope font-bold text-[10px] tracking-widest text-white/40 uppercase">Sarah K.</span>
                                </div>
                            </div>
                        </section>

                        {/* CONTACT US (Sized to viewport) */}
                        <section id="contactus" className="min-h-screen flex items-center justify-center px-6 py-20">
                            <div className="max-w-4xl w-full glowing-container">
                                <div className="glowing-inner p-10 md:p-16">
                                    <h2 className="font-instrument text-5xl md:text-6xl text-center glow-text italic mb-10">Inquire</h2>
                                    <form className="grid grid-cols-1 md:grid-cols-2 gap-6" onSubmit={e => e.preventDefault()}>
                                        <input type="text" placeholder="Name" className="bg-white/5 border border-white/10 p-4 rounded focus:border-primary outline-none transition-all" />
                                        <input type="email" placeholder="Email" className="bg-white/5 border border-white/10 p-4 rounded focus:border-primary outline-none transition-all" />
                                        <textarea placeholder="Message" className="md:col-span-2 bg-white/5 border border-white/10 p-4 rounded h-32 focus:border-primary outline-none transition-all"></textarea>
                                        <button className="md:col-span-2 bg-primary py-4 font-manrope font-bold text-[12px] tracking-[0.3em] uppercase hover:shadow-[0_0_30px_#7b39fc] transition-all">Submit</button>
                                    </form>
                                </div>
                            </div>
                        </section>
                    </main>

                    {/* FOOTER */}
                    <footer className="relative z-10 footer-glow bg-black py-20 px-6 border-t border-white/10">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-10">
                            <div className="flex items-center gap-4">
                                <div className="w-8 h-8 bg-white text-black flex items-center justify-center font-bold">D</div>
                                <span className="font-manrope font-bold tracking-[0.5em] text-xs">DATACORE</span>
                            </div>
                            <div className="flex gap-10 text-[10px] font-manrope font-bold text-white/30 tracking-widest uppercase">
                                <a href="#" className="hover:text-primary">Privacy</a>
                                <a href="#" className="hover:text-primary">Legal</a>
                            </div>
                            <p className="text-white/20 text-[9px] tracking-[0.2em] font-inter uppercase">© 2026 Datacore Digital. All rights reserved.</p>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LandingPage />);
    </script>
</body>
</html>
