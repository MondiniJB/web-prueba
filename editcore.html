<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EditCore - Masterclass 2026</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabin:wght@500;600&family=Instrument+Serif:ital,wght@0,400;1,400&family=Inter:wght@400;600&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#7b39fc', dark: '#2b2344' },
                    fontFamily: {
                        manrope: ['Manrope', 'sans-serif'],
                        cabin: ['Cabin', 'sans-serif'],
                        instrument: ['Instrument Serif', 'serif'],
                        inter: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        html { scroll-behavior: smooth; }
        body { background-color: #05020a; color: white; overflow-x: hidden; }
        
        /* Cinematic Grain Overlay */
        .noise-overlay {
            position: fixed; inset: 0; width: 100%; height: 100%;
            background: url('https://grainy-gradients.vercel.app/noise.svg');
            opacity: 0.2; pointer-events: none; z-index: 90; filter: contrast(180%) brightness(120%);
        }

        /* Large Carousel Animation */
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .animate-marquee {
            display: flex;
            width: max-content;
            animation: marquee 40s linear infinite;
        }

        /* The Ultra-Glow Border */
        .glowing-container {
            position: relative; padding: 5px; border-radius: 32px;
            overflow: hidden; box-shadow: 0 0 70px rgba(123, 57, 252, 0.6);
        }
        .glowing-container::before {
            content: ''; position: absolute; width: 250%; height: 250%;
            background: conic-gradient(transparent, #7b39fc, #fff, #7b39fc, transparent 40%);
            top: -75%; left: -75%; animation: borderRotate 2s linear infinite;
        }
        @keyframes borderRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        .glowing-inner { 
            position: relative; z-index: 10; background: #0a0812; border-radius: 28px; 
            box-shadow: inset 0 0 20px rgba(123, 57, 252, 0.2);
        }
        
        .section-full { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div id="root"></div>
    <div class="noise-overlay"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [selectedCourses, setSelectedCourses] = useState([]);
            const [blur, setBlur] = useState(0);

            useEffect(() => {
                const handleScroll = () => setBlur(Math.min(window.scrollY / 25, 30));
                window.addEventListener("scroll", handleScroll);
                return () => window.removeEventListener("scroll", handleScroll);
            }, []);

            const toggleCourse = (course) => {
                setSelectedCourses(prev => 
                    prev.includes(course) ? prev.filter(c => c !== course) : [...prev, course]
                );
            };

            // Custom Scroll to center section perfectly
            const scrollToSection = (id) => {
                const el = document.getElementById(id);
                if (el) {
                    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            };

            return (
                <div className="relative w-full">
                    {/* VIDEO BACKGROUND */}
                    <div className="fixed inset-0 z-0" style={{ filter: `blur(${blur}px)` }}>
                        <video autoPlay loop muted playsInline className="w-full h-full object-cover brightness-[0.35] grayscale-[0.2]">
                            <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260210_031346_d87182fb-b0af-4273-84d1-c6fd17d6bf0f.mp4" type="video/mp4" />
                        </video>
                    </div>

                    {/* NAVBAR */}
                    <nav className="fixed top-0 z-[100] w-full flex items-center justify-between px-6 lg:px-[120px] py-6 bg-black/60 backdrop-blur-2xl border-b border-white/5">
                        <div className="font-manrope font-bold tracking-tighter text-2xl flex items-center gap-3 cursor-pointer" onClick={() => window.scrollTo(0,0)}>
                            <div className="w-10 h-10 bg-primary rounded-lg flex items-center justify-center text-sm font-black italic shadow-[0_0_15px_rgba(123,57,252,0.5)]">EC</div>
                            EDITCORE
                        </div>
                        <div className="hidden lg:flex gap-12 font-manrope font-bold text-[11px] tracking-[0.3em] uppercase text-white/50">
                            <button onClick={() => scrollToSection('courses')} className="hover:text-primary transition-all">Courses</button>
                            <button onClick={() => scrollToSection('demo')} className="hover:text-primary transition-all">Gallery</button>
                            <button onClick={() => scrollToSection('contact')} className="hover:text-primary transition-all">Enroll</button>
                        </div>
                        <button onClick={() => scrollToSection('contact')} className="bg-primary px-8 py-3 rounded-full font-manrope font-bold text-[11px] uppercase tracking-widest hover:shadow-[0_0_30px_#7b39fc] transition-all">
                            Enroll Now
                        </button>
                    </nav>

                    {/* HERO */}
                    <section className="section-full relative z-10 px-6">
                        <div className="text-center">
                            <div className="inline-block bg-primary/10 border border-primary/40 px-6 py-2 rounded-full mb-10 backdrop-blur-xl">
                                <span className="font-manrope text-[10px] font-bold tracking-[0.4em] text-primary">ADVANCED EDITOR PROTOCOL // 2026</span>
                            </div>
                            <h1 className="font-instrument text-[60px] md:text-[115px] leading-[0.95] max-w-[1100px] mb-10 drop-shadow-[0_0_20px_rgba(123,57,252,0.3)]">
                                Create <span className="italic">Cinematic</span> <br/> Masterpieces.
                            </h1>
                            <p className="text-white/80 font-inter text-xl md:text-2xl max-w-2xl mx-auto mb-14 leading-relaxed">Top-tier training for After Effects, Premiere Pro, and FL Studio. Built for the next generation of creators.</p>
                            <div className="flex flex-col sm:flex-row justify-center gap-6">
                                <button onClick={() => scrollToSection('courses')} className="bg-primary px-12 py-6 rounded-2xl font-cabin font-bold text-sm tracking-widest uppercase shadow-2xl hover:scale-105 transition-all">Browse Courses</button>
                                <button onClick={() => scrollToSection('demo')} className="bg-white/5 backdrop-blur-xl px-12 py-6 rounded-2xl border border-white/20 font-cabin font-bold text-sm tracking-widest uppercase hover:bg-white/10 transition-all">View Gallery</button>
                            </div>
                        </div>
                    </section>

                    {/* COURSES SECTION */}
                    <section id="courses" className="section-full relative z-10 px-6 lg:px-[120px] py-32">
                        <div className="w-full">
                            <h2 className="font-instrument text-7xl md:text-9xl text-center mb-28 italic tracking-tighter">The Toolkit</h2>
                            <div className="grid lg:grid-cols-3 gap-10 max-w-7xl mx-auto">
                                {[
                                    { t: "After Effects", d: "Master motion graphics, expressions, and 3D space.", icon: "Ae" },
                                    { t: "Premiere Pro", d: "High-end narrative cutting and advanced color science.", icon: "Pr" },
                                    { t: "FL Studio", d: "Soundtrack scoring and hybrid sound design techniques.", icon: "Fl" }
                                ].map((c, i) => (
                                    <div key={i} className="bg-white/5 backdrop-blur-lg p-12 rounded-[48px] border border-white/10 group hover:border-primary transition-all duration-500 hover:-translate-y-2">
                                        <div className="w-20 h-20 bg-primary/20 rounded-3xl flex items-center justify-center text-3xl font-black text-primary mb-10 group-hover:shadow-[0_0_30px_rgba(123,57,252,0.4)] transition-all">
                                            {c.icon}
                                        </div>
                                        <h3 className="font-instrument text-4xl mb-6 italic">{c.t}</h3>
                                        <p className="text-white/60 font-inter leading-relaxed text-xl mb-12">{c.d}</p>
                                        <button onClick={() => scrollToSection('contact')} className="text-primary font-bold text-[10px] tracking-widest uppercase hover:underline">Get Syllabus &rarr;</button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* DEMONSTRATION CAROUSEL (BIGGER & REALISTIC) */}
                    <section id="demo" className="relative py-48 overflow-hidden z-10 bg-black/40 border-y border-white/5">
                        <h2 className="font-instrument text-7xl md:text-9xl text-center mb-24 italic">Visual Power</h2>
                        <div className="animate-marquee gap-10">
                            {[
                                "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJocXJ5dmRscXJpYXRreHh3dHBxcHFwcHFwcHFwcHFwcHFwcHFwcCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3o7TKMGpxVfFvTdf4k/giphy.gif",
                                "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJocXJ5dmRscXJpYXRreHh3dHBxcHFwcHFwcHFwcHFwcHFwcHFwcCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/l41lTjJptGZ2s7a5W/giphy.gif",
                                "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJocXJ5dmRscXJpYXRreHh3dHBxcHFwcHFwcHFwcHFwcHFwcHFwcCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/26uf404O4J8oOQ6Nq/giphy.gif",
                                "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJocXJ5dmRscXJpYXRreHh3dHBxcHFwcHFwcHFwcHFwcHFwcCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3o7TKVUn7iM8FMEU24/giphy.gif"
                            ].concat([
                                "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJocXJ5dmRscXJpYXRreHh3dHBxcHFwcHFwcHFwcHFwcHFwcCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3o7TKMGpxVfFvTdf4k/giphy.gif",
                                "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJocXJ5dmRscXJpYXRreHh3dHBxcHFwcHFwcHFwcHFwcHFwcCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/l41lTjJptGZ2s7a5W/giphy.gif"
                            ]).map((gif, i) => (
                                <div key={i} className="w-[600px] h-[350px] bg-zinc-900 rounded-[32px] flex-shrink-0 overflow-hidden border-2 border-white/10 group shadow-2xl">
                                    <img src={gif} className="w-full h-full object-cover opacity-60 group-hover:opacity-100 group-hover:scale-110 transition-all duration-1000 grayscale group-hover:grayscale-0" />
                                    <div className="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent flex items-end p-10 opacity-0 group-hover:opacity-100 transition-opacity">
                                        <p className="font-manrope font-bold text-xs tracking-widest uppercase">Project Preview 0{i+1}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* CONTACT FORM (SNAP FITTED) */}
                    <section id="contact" className="section-full relative z-10 px-6 lg:px-[120px] bg-black">
                        <div className="max-w-5xl w-full glowing-container">
                            <div className="glowing-inner p-10 md:p-20">
                                <h2 className="font-instrument text-6xl md:text-8xl text-center mb-6 italic tracking-tighter">Start your career now!</h2>
                                <p className="text-center text-white/50 font-inter text-xl mb-16 max-w-xl mx-auto leading-relaxed">Select your specialization and our team will provide immediate onboarding details.</p>
                                
                                <form className="space-y-10" onSubmit={e => e.preventDefault()}>
                                    <div className="grid md:grid-cols-2 gap-10">
                                        <div className="flex flex-col gap-3">
                                            <label className="text-[10px] font-bold tracking-widest text-primary ml-2">IDENTITY</label>
                                            <input type="text" placeholder="Your Name" className="bg-white/5 border border-white/10 p-6 rounded-2xl focus:border-primary outline-none transition-all font-manrope text-lg uppercase tracking-widest" />
                                        </div>
                                        <div className="flex flex-col gap-3">
                                            <label className="text-[10px] font-bold tracking-widest text-primary ml-2">COMMUNICATION</label>
                                            <input type="email" placeholder="E-mail" className="bg-white/5 border border-white/10 p-6 rounded-2xl focus:border-primary outline-none transition-all font-manrope text-lg uppercase tracking-widest" />
                                        </div>
                                    </div>

                                    <div className="space-y-6">
                                        <label className="text-[11px] font-bold tracking-[0.4em] text-white/30 uppercase block text-center">Select Specialization Paths</label>
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                            {["After Effects", "Premiere Pro", "FL Studio"].map(course => (
                                                <button 
                                                    key={course}
                                                    type="button"
                                                    onClick={() => toggleCourse(course)}
                                                    className={`py-5 rounded-2xl border-2 transition-all font-manrope font-bold text-xs tracking-widest uppercase ${selectedCourses.includes(course) ? 'border-primary bg-primary/20 text-white shadow-[0_0_25px_#7b39fc]' : 'border-white/10 text-white/30 hover:border-white/30'}`}
                                                >
                                                    {course}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <button className="w-full bg-primary py-8 rounded-[24px] font-manrope font-bold text-sm tracking-[0.5em] uppercase hover:shadow-[0_0_50px_#7b39fc] transition-all hover:scale-[1.02]">
                                        Request Enrollment
                                    </button>
                                </form>
                            </div>
                        </div>
                    </section>

                    {/* FOOTER (PUSHED DOWN) */}
                    <footer className="relative py-24 border-t border-white/10 bg-[#050505] z-10 px-6 lg:px-[120px]">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-12">
                            <div className="font-manrope font-bold tracking-[0.4em] text-sm text-white/20 flex items-center gap-4">
                                <div className="w-8 h-8 border border-white/10 flex items-center justify-center">E</div>
                                EDITCORE DIGITAL ACADEMY
                            </div>
                            <div className="flex gap-12 text-white/20 text-[10px] font-manrope font-bold tracking-[0.4em] uppercase">
                                <a href="#" className="hover:text-primary transition-colors">Privacy</a>
                                <a href="#" className="hover:text-primary transition-colors">Terms</a>
                                <a href="#" className="hover:text-primary transition-colors">Support</a>
                            </div>
                            <div className="text-white/10 text-[9px] font-inter uppercase tracking-widest">© 2026 // Designed for high-performance editors.</div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
